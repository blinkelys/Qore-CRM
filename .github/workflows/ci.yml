name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Start container stack
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 180
      - name: Smoke test through Nginx
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep 'Qore CRM'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health | grep '"status":"ok"'
      - name: Integration tests against PostgreSQL
        run: TEST_DATABASE_URL=postgresql://qore:qore_local_only@localhost:55432/qore npm run test:integration -w @qore/api
      - name: Check database outage and recovery
        run: |
          docker compose stop db
          test "$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)" = 503
          docker compose start db
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors --max-time 5 http://127.0.0.1:8080/api/health | grep '"status":"ok"'
      - name: Container logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up containers
        if: always()
        run: docker compose down -v
